---
substitutions:
  name: 'citrus-sensor'
  name_add_mac_suffix: 'true'
  project_name: 'dudemcbacon.${name}'
  project_version: '1.0'
  board: 'seeed_xiao_esp32c6'
  platform: 'esp-idf'
  yamlfile: 'citrus-sensor.yaml'

  # I2C bus (XIAO ESP32-C6: D4/D5)
  i2c_sda_pin: GPIO22
  i2c_scl_pin: GPIO23

  # Battery voltage on analog pin A0 (ADC1)
  battery_pin: GPIO0

  # DS18B20 one-wire pins (D3/D6/D7) - one sensor per pin
  ds18b20_pin_1: GPIO19
  ds18b20_pin_2: GPIO2
  ds18b20_pin_3: GPIO21

  # Buttons (D10/D8) - grounded when pressed
  deep_sleep_toggle_pin: GPIO18
  push_metrics_button_pin: GPIO1

  # LED (D9) - active high
  led_pin: GPIO20

  # Deep Sleep defaults. Both are runtime-configurable from Home Assistant via
  # the "Run Duration" / "Sleep Duration" number entities below, which persist
  # their values in NVS across deep sleep and power loss. These substitutions
  # are only the first-boot values (before anything has been stored) and the
  # component-level fallback.
  default_run_duration: '60' # seconds awake
  default_sleep_duration: '5' # minutes asleep

globals:
  - id: screen_text
    type: std::string
    initial_value: ''

esphome:
  on_boot:
    - then:
        - output.turn_off: rf_switch_enable
        - delay: 100ms
        - output.turn_on: antenna_select
    # After all components are initialized, read every sensor and publish once.
    # Runs on every wake (timer or wakeup_pin), so a button-triggered wake reads
    # and publishes immediately instead of waiting for the poll intervals. This
    # also covers the battery (60s interval), which otherwise never publishes
    # inside the awake window.
    - priority: -100
      then:
        - script.execute: read_and_publish
  on_shutdown:
    - lambda: |-
        id(oled).turn_off();

output:
  - platform: gpio
    id: rf_switch_enable
    pin: GPIO3
  - platform: gpio
    id: antenna_select
    pin: GPIO14

# Shared config: esphome/esp32/wifi/api/ota/logger/web_server/etc.
packages:
  base: !include common/base.yaml

# All sensors + the OLED share a single I2C bus
i2c:
  sda: '${i2c_sda_pin}'
  scl: '${i2c_scl_pin}'
  frequency: 400khz
  scan: true
  timeout: 10ms

# One-wire buses for the DS18B20 sensors (one bus per GPIO)
one_wire:
  - platform: gpio
    pin: '${ds18b20_pin_1}'
    id: onewire_1
  - platform: gpio
    pin: '${ds18b20_pin_2}'
    id: onewire_2
  - platform: gpio
    pin: '${ds18b20_pin_3}'
    id: onewire_3

deep_sleep:
  id: deep_sleep_1
  # Fallbacks only. The number entities below overwrite both of these while the
  # device boots: template numbers set up at HARDWARE priority (800) and publish
  # their restored value, while this component sets up at LATE (-100) and only
  # then arms its sleep timer, so it always sees the configured values.
  run_duration: '${default_run_duration}s'
  sleep_duration: '${default_sleep_duration}min'
  # Wake the board when the push-metrics button is pressed (active-low).
  #
  # This block is intentionally COMMENTED OUT: ESPHome rejects it as written.
  # On the ESP32-C6 only the LP-domain GPIOs can wake from deep sleep, so the
  # only valid wakeup pins are GPIO0, GPIO1, GPIO2, GPIO3, GPIO4, GPIO5, GPIO6
  # and GPIO7. GPIO19 (the current push_metrics_button_pin) is powered down
  # while sleeping and fails validation with "Only pins 0-7 support wakeup".
  #
  # On the XIAO ESP32-C6 only GPIO0/GPIO1/GPIO2 (pads D0/D1/D2) from that range
  # are broken out, and all three are currently used (battery ADC + the two
  # DS18B20 sensors). To enable wake-on-button: move the button to one of
  # GPIO0-GPIO7 (freeing whatever sensor is on it), update
  # push_metrics_button_pin above, then uncomment the block below.
  #
  wakeup_pin:
    allow_other_uses: true
    number: '${push_metrics_button_pin}'
    mode: INPUT_PULLUP
    inverted: true
    # If the button is still held at sleep time, wait for release instead of
    # sleeping and immediately waking again.
  wakeup_pin_mode: KEEP_AWAKE

# Font for the OLED (gfonts:// is downloaded at compile time - needs internet)
font:
  - file: 'gfonts://Roboto'
    id: font_roboto
    size: 12
  # Smaller font for the deep-sleep countdown line at the bottom of the OLED
  - file: 'gfonts://Roboto'
    id: font_roboto_small
    size: 10

sensor:
  # LTR390 - UV + ambient light
  - platform: ltr390
    id: ltr390_hub
    address: 0x53
    update_interval: 5s
    uv_index:
      name: 'LTR390 UV Index'
      id: uv_index
    uv:
      name: 'LTR390 UV Counts'
    light:
      name: 'LTR390 Ambient Light'
    ambient_light:
      name: 'LTR390 Ambient Light Counts'

  # SHT31-D - temperature + humidity
  - platform: sht3xd
    id: sht3xd_hub
    address: 0x44
    update_interval: 5s
    temperature:
      name: 'SHT31 Temperature'
      id: temp_sht
    humidity:
      name: 'SHT31 Humidity'
      id: hum_sht

  # VEML7700 - ambient light
  - platform: veml7700
    id: veml7700_hub
    address: 0x10
    update_interval: 5s
    ambient_light:
      name: 'VEML7700 Ambient Light'
      id: lux_veml
    actual_gain:
      name: 'VEML7700 Actual Gain'

  # BMP280 - temperature, pressure
  - platform: bmp280_i2c
    id: bmp280_hub
    address: 0x76
    update_interval: 5s
    temperature:
      name: 'BMP280 Temperature'
      oversampling: 16x
    pressure:
      name: 'BMP280 Pressure'

  # Battery voltage via analog pin + external divider
  - platform: adc
    pin: '${battery_pin}'
    name: 'Battery Voltage'
    id: battery_voltage
    update_interval: 5s
    attenuation: 12db
    unit_of_measurement: 'V'
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 3
    filters:
      # 1. Reverse the voltage divider mathematically
      # Ratio = (R1 + R2) / R2 = (100k + 100k) / 100k = 2.0
      # If you measured your resistors and they aren't exactly 100k,
      # calculate the exact ratio and replace 2.0 here (e.g., 2.014).
      - multiply: 2.0

      # 2. Software Multisampling / Noise Reduction
      # This averages the last 10 readings to eliminate ADC jitter
      - sliding_window_moving_average:
          window_size: 10
          send_every: 1

      # Two 100k resistors form a 1:1 divider, so the pin sees half the pack
      # voltage and `multiply: 2.0` should recover it in theory. But the
      # ESP32-C6 ADC has large gain error (a real ~4.2V pack read ~5.4V), so we
      # calibrate empirically: map raw pin voltage -> true pack voltage.
      #   <raw_adc_volts> -> <multimeter_pack_volts>
      # The 2.70 -> 4.20 point is derived from the 5.4V reading (5.4 / 2.0 =
      # 2.70 at the pin). For best accuracy, replace these with your own
      # measurements and add a second point at a lower charge level.
      #- calibrate_linear:
      #    - 0.0 -> 0.0
      #    - 2.70 -> 4.20

  # Battery percentage estimated from the pack voltage (rough Li-ion curve)
  - platform: template
    name: 'Battery Percentage'
    id: battery_percentage
    unit_of_measurement: '%'
    device_class: battery
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float v = id(battery_voltage).state;
      if (isnan(v))
        return NAN;
      // Linear approximation: 3.30V empty -> 4.20V full. Li-ion discharge is
      // nonlinear, so this is only a gauge; tweak the endpoints as needed.
      float pct = (v - 3.30f) / (4.20f - 3.30f) * 100.0f;
      return pct < 0.0f ? 0.0f : (pct > 100.0f ? 100.0f : pct);

  # DS18B20 temperature sensors (one per one-wire bus)
  - platform: dallas_temp
    one_wire_id: onewire_1
    id: ds18b20_1
    name: 'DS18B20 Temperature 1'
    update_interval: 10s
  - platform: dallas_temp
    one_wire_id: onewire_2
    id: ds18b20_2
    name: 'DS18B20 Temperature 2'
    update_interval: 10s
  - platform: dallas_temp
    one_wire_id: onewire_3
    id: ds18b20_3
    name: 'DS18B20 Temperature 3'
    update_interval: 10s

button:
  - platform: restart
    id: restart_button
    name: 'Device Restart'

# Runtime-configurable deep sleep timings. Both are optimistic (so Home
# Assistant can set them without a backing device value) and restored from NVS
# on every wake, which is what makes them survive deep sleep.
number:
  # How long to stay awake each wake cycle. deep_sleep arms its sleep timer once
  # during setup, so changing this while awake takes effect on the NEXT wake
  # rather than lengthening or cutting short the current one.
  - platform: template
    id: run_duration_number
    name: 'Run Duration'
    icon: 'mdi:timer-play-outline'
    entity_category: config
    unit_of_measurement: 's'
    optimistic: true
    restore_value: true
    initial_value: ${default_run_duration}
    min_value: 10
    max_value: 600
    step: 5
    mode: box
    on_value:
      - lambda: |-
          id(deep_sleep_1).set_run_duration((uint32_t) lroundf(x * 1000.0f));

  # How long to sleep between wakes. This one is read at sleep time, so a change
  # applies to the very next sleep.
  - platform: template
    id: sleep_duration_number
    name: 'Sleep Duration'
    icon: 'mdi:timer-sand'
    entity_category: config
    unit_of_measurement: 'min'
    optimistic: true
    restore_value: true
    initial_value: ${default_sleep_duration}
    min_value: 1
    max_value: 240
    step: 1
    mode: box
    on_value:
      - lambda: |-
          id(deep_sleep_1).set_sleep_duration((uint32_t) lroundf(x * 60000.0f));

binary_sensor:
  # Buttons ground the pin when pressed
  - platform: gpio
    id: deep_sleep_toggle
    name: 'Deep Sleep Toggle'
    use_interrupt: true
    filters:
      - delayed_on: 10ms
    pin:
      number: '${deep_sleep_toggle_pin}'
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - switch.turn_on: led
      - deep_sleep.prevent: deep_sleep_1
    on_release:
      - switch.turn_off: led
      - deep_sleep.allow: deep_sleep_1
  - platform: gpio
    id: push_metrics_button
    name: 'Push Metrics Button'
    use_interrupt: true
    filters:
      - delayed_on: 10ms
    pin:
      allow_other_uses: true
      number: '${push_metrics_button_pin}'
      mode: INPUT_PULLUP
      inverted: true
    # Read all sensors and publish right away. On a wakeup_pin-triggered wake
    # this fires as the device comes up (in addition to the on_boot script).
    on_press:
      - script.execute: read_and_publish
    on_multi_click:
      - timing:
          - ON for at least 3s
        then:
          - logger.log: 'Push Metrics Long Pressed!'
          - lambda: 'id(screen_text) = "Long Pressed!";'
          - component.update: oled
          - button.press: restart_button

switch:
  # LED is active when the pin is driven high
  - platform: gpio
    id: led
    name: 'LED'
    pin:
      number: '${led_pin}'

# Reads every polling sensor and publishes its state immediately. Called on
# wake (on_boot) and whenever the push-metrics button is pressed.
script:
  - id: read_and_publish
    then:
      - component.update: ltr390_hub
      - component.update: sht3xd_hub
      - component.update: veml7700_hub
      - component.update: bmp280_hub
      - component.update: battery_voltage
      - component.update: battery_percentage
      - component.update: ds18b20_1
      - component.update: ds18b20_2
      - component.update: ds18b20_3

text_sensor:
  - platform: wifi_info
    ip_address:
      id: local_ip_address
      internal: true

display:
  - platform: ssd1306_i2c
    model: 'SSD1306 128x64'
    address: 0x3C
    id: oled
    lambda: |-
      // Format a sensor value, or "--" when it has no reading yet: a fresh
      // sensor reads NaN until its first successful poll (or on a bus fault),
      // which would otherwise render as "nan" on the screen.
      auto fmt = [](float v, int prec, const char *unit) -> std::string {
        if (isnan(v))
          return std::string("--") + unit;
        char buf[16];
        snprintf(buf, sizeof(buf), "%.*f%s", prec, v, unit);
        return buf;
      };

      // Four data rows in the 12px font (0/13/26/39) leave a clear bottom row.
      it.printf(0, 0, id(font_roboto), "T: %s", fmt(id(temp_sht).state, 1, " C").c_str());
      it.printf(0, 13, id(font_roboto), "RH: %s", fmt(id(hum_sht).state, 0, " %").c_str());
      it.printf(128, 13, id(font_roboto), TextAlign::TOP_RIGHT, id(screen_text).c_str());
      it.printf(0, 26, id(font_roboto), "Lux: %s", fmt(id(lux_veml).state, 0, "").c_str());
      it.printf(0, 39, id(font_roboto), "UVI: %s  %s",
                fmt(id(uv_index).state, 1, "").c_str(),
                fmt(id(battery_percentage).state, 0, "%").c_str());
      if (id(deep_sleep_toggle).state) {
        // Deep sleep disabled via the toggle button
        it.print(128, 0, id(font_roboto), TextAlign::TOP_RIGHT, "DSO");
      } else {
        // Deep sleep enabled: count down to the next sleep on the bottom row.
        // run_duration is measured from boot, so remaining = run_duration - uptime.
        int remaining = (int) id(run_duration_number).state - (int) (millis() / 1000);
        if (remaining < 0)
          remaining = 0;
        it.printf(128, 64, id(font_roboto_small), TextAlign::BOTTOM_RIGHT, "%ds", remaining);
      }
      // Bottom-left of the screen: show the IP when connected, else "Not
      // connected". BOTTOM_LEFT anchors the text to y=64 so it draws upward
      // into the visible area (the countdown above shares this row on the right).
      if (network::is_connected() && id(local_ip_address).has_state()) {
        std::string ip = id(local_ip_address).state;
        if (!ip.empty() && ip != "0.0.0.0") {
          it.print(0, 64, id(font_roboto_small), TextAlign::BOTTOM_LEFT, ip.c_str());
          return;
        }
      }

      it.print(0, 64, id(font_roboto_small), TextAlign::BOTTOM_LEFT, "Not connected");
